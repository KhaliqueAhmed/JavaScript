<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>callbacks</title>
</head>
<body>
    <h1>Callbacks</h1>

    <p>function as a argument is knwon as callbacks</p>

    <h1>callback hell</h1>
    <p>nested callbacks are known as callback hell</p>
    <script>
        function getData(dataId, getNextData){
    setTimeout(()=>{
        console.log("data", dataId)
        if(getNextData){
            getNextData();
        }

    },2000)
}

getData(1, ()=>{
    console.log("getting data2");
    getData(2,()=>{
        console.log("getting data3");
        getData(3,()=>{
            getData(3)
        })
    })

})
    </script>
</body>
</html>
