<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        div
        {   display: flex;
            border: 2px solid black;
            height: 200px;
            width: 200px;
            text-align: center;
            justify-content: center;
            justify-items: center;
            justify-self: center;
        
            transition: background-color 0.5s;;

        
        }

        div a{
            margin: auto;
            text-decoration: none;

        }

        div:hover{
            background-color: greenyellow;
        }


        
    </style>
</head>
<body>
    <div>
        <a href="#google"><h2>Google</h2></a>
    </div>
    <div>
        <a href="#Youtube"><h2>Youtube</h2></a>
    </div>
</body>
</html>
